---
postgresql_port: 5432
postgresql_address: "*"
postgresql_user: postgres
postgresql_group: postgres

# Modules
postgresql_user_enable: true
postgresql_database_enable: true
postgresql_ssl_enable: true
postgresql_oauth_enable: false
postgresql_wal_enable: false

# Module - User configuration
postgresql_users:
  - { name: "easysec", password: "", superuser: true }
  - { name: "manager-easysec", password: "", superuser: false }

# Module - Database configuration
postgresql_databases:
  - { name: "easysec", owner: "manager-easysec", encoding: "UTF-8" }

# Module - SSL configuration - PostgreSQL connections + SSL role (refer to roles/ssl/README.md)
postgresql_ssl_cert_path: "{{ postgresql_config_dir }}/server.crt"
postgresql_ssl_key_path: "{{ postgresql_config_dir }}/server.key"
postgresql_ssl_dns_enabled: false
postgresql_ssl_provider: "cloudflare"
postgresql_ssl_credentials:
  token: "token1234"
postgresql_ssl_generate: true
postgresql_ssl_domain: "postgresql.easysec.x"
postgresql_ssl_output_path: "{{ postgresql_ssl_cert_path }}"
postgresql_ssl_privatekey_path: "{{ postgresql_ssl_key_path }}"
postgresql_ssl_crt_country: ""
postgresql_ssl_crt_organization_name: ""
postgresql_ssl_crt_unit_name: ""
postgresql_ssl_email: "admin@postgresql.easysec.x"
postgresql_ssl_owner: "{{ postgresql_user }}"
postgresql_ssl_group: "{{ postgresql_group }}"

# Module - Oauth
postgresql_oauth_provider: kc_validator
postgresql_oauth_endpoint: https://<keycloak>/realms/<realm>/protocol/openid-connect/token
postgresql_oauth_audience: postgres-resource
postgresql_oauth_resource_name: appdb
postgresql_oauth_client_id: postgres-resource
postgresql_oauth_http_timeout: 2000
postgresql_oauth_issuer: https://<keycloak>/realms/<realm>

# Module - WAL
postgresql_wal_level: "replica"
postgresql_wal_max_size: "1GB"
postgresql_wal_min_size: "80MB"
postgresql_wal_max_senders: 10
postgresql_wal_max_replicas: 10

# Access configuration - Updates PG_HBA template
postgresql_hba_entries:
  - { type: "local", database: "all", user: "postgres", address: "", method: "peer" }
  - { type: "hostssl", database: "all", user: "all", address: "0.0.0.0/0", method: "scram-sha-256" }
  - { type: "host", database: "all", user: "all", address: "0.0.0.0/0", method: "reject" }

# Config envs - Should not be changed unless knowing what they do
# # Config
postgresql_package_name: postgresql
postgresql_version: 18
postgresql_key_url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
postgresql_repo_url: https://apt.postgresql.org/pub/repos/apt
postgresql_repo_config: >
  Types: deb
  URIs: {{ postgresql_repo_url }}
  Suites: {{ ansible_facts['distribution_release'] }}-pgdg
  Architectures: amd64
  Components: main
  Signed-By: {{ postgresql_key_path }}
postgresql_shared_buffers: "{{ (ansible_facts['memtotal_mb'] * 0.25) | int }}MB"
postgresql_sysctl_params:
  - { name: "vm.overcommit_memory", value: "2" }
  - { name: "vm.overcommit_ratio", value: "80" }
  - { name: "vm.nr_hugepages", value: "{{ ((ansible_facts['memtotal_mb'] * 0.25 / 2) * 1.1) | int }}" }
postgresql_superadmin_user_rights: SUPERUSER
postgresql_normal_user_rights: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

# # Folders
postgresql_data_folder: /var/lib/postgresql/{{ postgresql_version }}/main
postgresql_config_folder: /etc/postgresql/{{ postgresql_version }}/main
postgresql_log_folder: /var/log/postgresql
postgresql_unix_socket_folder: /var/run/postgresql

## Files
postgresql_key_path: "/etc/apt/keyrings/{{ postgresql_package_name }}.asc"
postgresql_apt_source_path: /etc/apt/sources.list.d/pgdg.sources
postgresql_conf_path: "{{ postgresql_config_dir }}/postgresql.conf"
postgresql_hba_path: "{{ postgresql_config_dir }}/pg_hba.conf"
postgresql_indent_path: "{{ postgresql_config_dir }}/pg_ident.conf"
postgresql_config_template_path: templates/postgresql.conf.j2
postgresql_hba_template_path: templates/pg_hba.conf.j2
postgresql_password_output_path: "{{ playbook_folder }}/../generated/postgresql_users.txt"
