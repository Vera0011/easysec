---
- name: Creates the default log directory
  ansible.builtin.file:
    path: "{{ proxychains_log_folder }}"
    recurse: true
    state: directory
    group: "{{ proxychains_group }}"
    owner: "{{ proxychains_user }}"
    mode: "755"

- name: Creates the default log files
  loop: "{{ range(1, proxychains_total_proxies + 1) | list }}"
  ansible.builtin.file:
    dest: "{{ proxychains_log_folder }}/instance-{{ item }}.log"
    state: touch
    group: "{{ proxychains_group }}"
    owner: "{{ proxychains_user }}"
    mode: "644"

- name: Creates the default lib dirs
  loop: "{{ range(1, proxychains_total_proxies + 1) | list }}"
  ansible.builtin.file:
    path: "{{ proxychains_lib_folder }}/instance-{{ item }}"
    recurse: true
    state: directory
    group: "{{ proxychains_group }}"
    owner: "{{ proxychains_user }}"
    mode: "755"

- name: Creates the config directory for proxies
  ansible.builtin.file:
    path: "{{ proxychains_config_folder }}"
    mode: "755"
    recurse: true
    state: directory
    owner: "{{ proxychains_user }}"
    group: "{{ proxychains_group }}"

- name: Creates the config files of proxies
  loop: "{{ range(1, proxychains_total_proxies + 1) | list }}"
  ansible.builtin.template:
    src: "{{ proxychains_service_config_template_path }}"
    dest: "{{ proxychains_config_folder }}/instance-{{ item }}"
    mode: "644"
    owner: root
    group: root
    force: true

- name: Create the unit file for the systemctl daemon
  ansible.builtin.template:
    src: "{{ proxychains_service_unit_template_path }}"
    dest: "{{ proxychains_service_unit_path }}"
    mode: "644"
    owner: root
    group: root

- name: Create the run directory
  loop: "{{ range(1, proxychains_total_proxies + 1) | list }}"
  ansible.builtin.file:
    path: "{{ proxychains_execution_folder }}/instance-{{ item }}"
    recurse: true
    state: directory
    group: root
    owner: root
    mode: "644"

- name: We restart systemctl daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Creates the config for proxychains
  ansible.builtin.template:
    src: "{{ proxychains_template_path }}"
    dest: "{{ proxychains_config_path }}"
    mode: "644"
    owner: root
    group: root
    force: true

- name: Creates the config for proxychains4
  ansible.builtin.template:
    src: "{{ proxychains_template_path }}"
    dest: "{{ proxychains_4_config_path }}"
    mode: "644"
    owner: root
    group: root
    force: true

- name: We start and enable all Tor services
  loop: "{{ range(1, proxychains_total_proxies + 1) | list }}"
  ansible.builtin.systemd:
    state: started
    enabled: true
    name: "{{ proxychains_service_start_name }}-{{ item }}"
