---
- name: Lists all instances from tor (old ones)
  register: proxychains_active_services
  become: true
  changed_when: false
  ansible.builtin.systemd:
    name: "{{ proxychains_service_start_name }}-*"

- name: Extracts the names of the services
  ansible.builtin.set_fact:
    proxychains_mapped_services: >-
      {{
        proxychains_active_services.stdout_lines
        | map('regex_search', proxychains_service_start_name + '[^. ]+')
        | select('string')
        | list
      }}

- name: Stops and deletes all current services
  loop: "{{ proxychains_mapped_services }}"
  ansible.builtin.systemd:
    state: stopped
    enabled: false
    name: "{{ item }}.service"

- name: Deletes all previous logs
  ansible.builtin.file:
    path: "{{ proxychains_log_folder }}"
    state: absent
    force: true

- name: Deletes all previous data
  ansible.builtin.file:
    path: "{{ proxychains_lib_folder }}"
    state: absent
    force: true

- name: Deletes all previous configs
  ansible.builtin.file:
    path: "{{ proxychains_config_folder }}"
    state: absent
    force: true

- name: Deletes all previous units
  ansible.builtin.file:
    path: "{{ proxychains_service_unit_path }}"
    state: absent
    force: true

- name: Reloads daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Resets daemon (for failed units)
  changed_when: true
  ansible.builtin.command:
    cmd: systemctl reset-failed
