---
- name: Downloads installation script
  ansible.builtin.get_url:
    url: "{{ grype_host }}"
    dest: "{{ grype_temp_path }}"
    mode: "0700"

- name: Install Grype
  ansible.builtin.command:
    cmd: "{{ grype_temp_path }} -b {{ grype_binary_folder }} -v"
    creates: "{{ grype_binary_path }}"

- name: Installation script removal
  ansible.builtin.file:
    path: "{{ grype_temp_path }}"
    state: absent
