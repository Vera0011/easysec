---
# BOOT-5122
- name: GRUB hardening
  when: hardening_grub_enabled
  notify:
    - Update GRUB
    - Exports GRUB password - General
    - Exports GRUB password - If executed in Vagrant
  block:
    - name: Generate random plaintext password
      ansible.builtin.set_fact:
        hardening_grub_text_password: "{{ lookup('community.general.random_string', length=20, special=true) }}"

    - name: Generating password hash
      register: hardening_grub_hash
      ansible.builtin.expect:
        command: /usr/bin/grub-mkpasswd-pbkdf2
        responses:
          "(?i)Enter password:": "{{ hardening_grub_text_password }}"
          "(?i)Reenter password:": "{{ hardening_grub_text_password }}"

    - name: Splits and corrects hash variable
      ansible.builtin.set_fact:
        hardening_grub_text_password: "{{ hardening_grub_hash.stdout_lines[-1].split()[-1] }}"

    - name: Stores GRUB password in system
      loop: "{{ hardening_grub_policies }}"
      register: hardening_grub_applied_result
      ansible.builtin.blockinfile:
        path: "{{ item.path }}"
        marker: "{{ hardening_header }}"
        block: "{{ item.config }}"
        insertafter: "{{ item.position }}"
        backup: true

# KRNL-5820
- name: Disabling Core dumps
  when: hardening_disable_coredumps
  notify: Daemon refresh
  block:
    - name: Disables core dumps
      loop: "{{ hardening_coredumps_policies }}"
      ansible.builtin.blockinfile:
        create: true
        mode: "0644"
        owner: "{{ hardening_user }}"
        group: "{{ hardening_group }}"
        path: "{{ item.path }}"
        marker: "{{ hardening_header }}"
        block: "{{ item.config }}"
        insertafter: "{{ item.position }}"
        backup: true

# AUTH-9230, AUTH-9286, AUTH-9328, AUTH-9282
- name: Enforcing password strength and account password locking
  when: hardening_passwords
  block:
    - name: Applies configurations for password policies
      loop: "{{ hardening_password_policies }}"
      ansible.builtin.blockinfile:
        path: "{{ item.path }}"
        marker: "{{ hardening_header }}"
        block: "{{ item.config }}"
        insertafter: "{{ item.position }}"
        backup: true

    - name: Locks root account password
      ansible.builtin.user:
        name: root
        state: present
        password_lock: true

# USB-1000
- name: Restricting port access (serial, USB, physical access) and blacklist kernel modules
  when: hardening_ports
  notify: Reload Udev rules
  block:
    - name: Applies configurations for password policies
      loop: "{{ hardening_physical_policies }}"
      ansible.builtin.blockinfile:
        create: true
        mode: "0644"
        owner: "{{ hardening_user }}"
        group: "{{ hardening_group }}"
        path: "{{ item.path }}"
        marker: "{{ hardening_header }}"
        block: "{{ item.config }}"
        insertafter: "{{ item.position }}"
        backup: true

    - name: Executes modprobe to apply restriction to USB ports
      community.general.modprobe:
        name: usb-storage
        state: absent

    - name: Find serial port devices
      register: hardening_serial_ports
      ansible.builtin.find:
        paths: /dev
        patterns: "ttyS*"
        file_type: any

    - name: Restrict access to serial ports
      loop: "{{ hardening_serial_ports.files }}"
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "0700"

# NETW-3200
- name: Restricting network protocols
  block:
    - name: Applies configurations for protocols
      loop: "{{ hardening_protocol_policies }}"
      ansible.builtin.blockinfile:
        create: true
        mode: "0644"
        owner: "{{ hardening_user }}"
        group: "{{ hardening_group }}"
        path: "{{ item.path }}"
        marker: "{{ hardening_header }}"
        block: "{{ item.config }}"
        insertafter: "{{ item.position }}"
        backup: true

    - name: Disables dccp protocol
      community.general.modprobe:
        name: dccp
        state: absent

    - name: Disables sctp protocol
      community.general.modprobe:
        name: sctp
        state: absent

    - name: Disables rds protocol
      community.general.modprobe:
        name: rds
        state: absent

    - name: Disables tipc protocol
      community.general.modprobe:
        name: tipc
        state: absent
