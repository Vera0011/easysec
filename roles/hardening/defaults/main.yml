---

hardening_user: root
hardening_group: root

hardening_grub: false
hardening_coredumps: true
hardening_passwords: true
hardening_ports: true
hardening_protocols: true
hardening_banners: true
hardening_antivirus: true
hardening_patch_management: true

# Config envs - Should not be changed unless knowing what they do
# # Config
hardening_header: "## -- {mark} EASYSEC CUSTOM CONFIGURATION -- ##"
hardening_grub_policies:
  lines:
    - path: /etc/default/grub
      regex: GRUB_DISABLE_RECOVERY\s+
      data: GRUB_DISABLE_RECOVERY="true"

    - path: /etc/default/grub
      regex: GRUB_ENABLE_CRYPTODISK\s+
      data: GRUB_ENABLE_CRYPTODISK=y

  blocks:
    - path: /etc/grub.d/40_custom
      config: |
        set superusers="admin"
        password_pbkdf2 admin {{ hardening_grub_text_password }}
      position: EOF

hardening_coredumps_policies:
  lines:
    - path: /etc/sysctl.conf
      regex: fs\.suid_dumpable
      data: fs.suid_dumpable=2

    - path: /etc/sysctl.conf
      regex: kernel\.core_pattern
      data: kernel.core_pattern=|/bin/false

    - path: /etc/systemd/system.conf
      regex: DefaultLimitCORE=
      data: DefaultLimitCORE=infinity

    - path: /etc/profile
      regex: ulimit\s+
      data: ulimit -S -c 0

  blocks:
    - path: /etc/security/limits.conf
      config: |
        * hard core 0
        * soft core 0
      position: EOF

    - path: /etc/systemd/coredump.conf
      config: |
        [Coredump]
        Storage=none
        ProcessSizeMax=0
      position: EOF

hardening_password_policies:
  lines:
    - path: /etc/login.defs
      regex: SULOG_FILE\s+
      data: SULOG_FILE /var/log/sulog

    - path: /etc/login.defs
      regex: ^UMASK\s+
      data: UMASK 027

    - path: /etc/login.defs
      regex: ^PASS_MAX_DAYS\s+
      data: PASS_MAX_DAYS 90

    - path: /etc/login.defs
      regex: ^PASS_MIN_DAYS\s+
      data: PASS_MIN_DAYS 7

    - path: /etc/login.defs
      regex: ^PASS_WARN_AGE\s+
      data: PASS_WARN_AGE 14

    - path: /etc/login.defs
      regex: ^ENCRYPT_METHOD\s+
      data: ENCRYPT_METHOD SHA512

    - path: /etc/login.defs
      regex: SHA_CRYPT_MIN_ROUND\s+
      data: SHA_CRYPT_MIN_ROUND 100000

    - path: /etc/login.defs
      regex: SHA_CRYPT_MAX_ROUNDS\s+
      data: SHA_CRYPT_MAX_ROUNDS 100000

hardening_ports_policies:
  blocks:
    - path: /etc/modprobe.d/disable-usb-storage.conf
      config: |
        blacklist usb-storage
      position: EOF

    - path: /etc/securetty
      config: |
        console
      position: EOF

    - path: /etc/modprobe.d/disable-firewire.conf
      config: |
        install firewire-core /bin/true
        install firewire-ohci /bin/true
      position: EOF

    - path: /etc/udev/rules.d/99-restrict-serial.rules
      config: |
        KERNEL=="ttyS*", MODE="0700"
      position: EOF

hardening_protocol_policies:
  blocks:
    - path: /etc/modprobe.d/nodccp.conf
      config: |
        install dccp /bin/true
      position: EOF

    - path: /etc/modprobe.d/nosctp.conf
      config: |
        install sctp /bin/true
      position: EOF

    - path: /etc/modprobe.d/nords.conf
      config: |
        install rds /bin/true
      position: EOF

    - path: /etc/modprobe.d/notipc.conf
      config: |
        install tipc /bin/true
      position: EOF

hardening_banners_config:
  - src: templates/banner.j2
    dest: /etc/issue

  - src: templates/banner.j2
    dest: /etc/issue.net

## Folders

## Files
hardening_grub_hash_output_path: "{{ playbook_dir }}/../generated/grub_password.txt"
hardening_grub_hash_vagrant_output_path: "{{ playbook_dir }}/../vagrant/.grub_pw_{{ inventory_hostname }}.txt"
