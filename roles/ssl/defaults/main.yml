---
ssl_user: root
ssl_group: root

# DNS-related configuration
ssl_dns: false
ssl_provider: "cloudflare"
ssl_credentials:
  token: "token1234"
  secret: "secret1234"
  consumer: "consumer1234"

# Certificate generation
ssl_generate: true
ssl_move_cert: false
ssl_move_key: false
ssl_move_csr: false

ssl_cert_path: "/tmp/{{ ssl_email }}.pem"
ssl_key_path: "/tmp/{{ ssl_email }}.key"
ssl_csr_path: "/tmp/{{ ssl_email }}.crs"
ssl_csr_config:
  country: "ES"
  organization_name: "EasySec"
  unit_name: "Security"

ssl_email: "whoami@easysec.x"
ssl_domain: "easysec.x"
ssl_new_owner: "{{ ssl_user }}"
ssl_new_group: "{{ ssl_group }}"

# Config: This section should not be changed
## Folders
ssl_config_folder: /etc/letsencrypt
ssl_live_certs_folder: /etc/letsencrypt/live
ssl_credentials_folder: /etc/letsencrypt
ssl_log_folder: /var/log/letsencrypt

## Files
ssl_renewal_template_path: templates/renewal.sh.j2

## Cron job
ssl_job_title: "EASYSEC - Renewal for {{ ssl_generate_config.domain }}"
ssl_job: >-
  certbot renew \
  --quiet \
  --cert-name {{ ssl_generate_config.domain }} \
  --deploy-hook {{ ssl_live_certs }}/{{ ssl_generate_config.domain }}/renewal.sh
